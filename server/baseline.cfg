#
# 단계 0 기준 설정: Yocto 기본 설정 + 디스플레이 승계·initramfs 실행에 꼭 필요한 항목만
# (부팅 시간 최적화는 하지 않음)
#
CONFIG_BLK_DEV_INITRD=y
CONFIG_RD_LZ4=y
CONFIG_KERNEL_LZ4=y
CONFIG_RELOCATABLE=y

# 디스플레이 승계: screen_info -> sysfb -> simple-framebuffer -> /dev/fb0
CONFIG_SYSFB=y
CONFIG_SYSFB_SIMPLEFB=y
CONFIG_FB=y
CONFIG_FB_DEVICE=y
CONFIG_FB_SIMPLE=y
# CONFIG_FB_VESA is not set
# CONFIG_FB_EFI is not set
# CONFIG_DRM is not set
# CONFIG_FRAMEBUFFER_CONSOLE is not set

# 앱 실행·로그
CONFIG_DEVTMPFS=y
CONFIG_BINFMT_ELF=y
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_PRINTK_TIME=y
