#
# Recovery kernel framebuffer support for existing QEMU display
#

#
# Initramfs support
#
CONFIG_BLK_DEV_INITRD=y
CONFIG_INITRAMFS_SOURCE=""
CONFIG_RD_LZ4=y
CONFIG_DECOMPRESS_LZ4=y
CONFIG_KERNEL_LZ4=y

#
# dev/proc/sysfs
#
CONFIG_DEVTMPFS=y
# CONFIG_DEVTMPFS_MOUNT is not set
CONFIG_PROC_FS=y
CONFIG_SYSFS=y
CONFIG_TMPFS=y
# CONFIG_TMPFS_POSIX_ACL is not set
# CONFIG_TMPFS_XATTR is not set

#
# PCI support - required for QEMU VGA/Bochs display device
#
CONFIG_PCI=y
# CONFIG_PCI_MSI is not set
CONFIG_HAS_IOMEM=y

#
# DMA buffer support
#
# CONFIG_DMA_SHARED_BUFFER is not set

#
# Firmware/sysfb fallback
#
CONFIG_SYSFB=y
CONFIG_SYSFB_SIMPLEFB=y

#
# Framebuffer core
#
CONFIG_FB=y
CONFIG_FB_CORE=y
CONFIG_FB_DEVICE=y
# CONFIG_FB_DEFERRED_IO is not set

#
# Legacy QEMU VGA framebuffer drivers
#
# CONFIG_FB_VESA is not set
# CONFIG_FB_EFI is not set
CONFIG_FB_SIMPLE=y

#
# DRM core and fbdev emulation
#
# CONFIG_DRM is not set
# CONFIG_DRM_KMS_HELPER is not set
# CONFIG_DRM_FBDEV_EMULATION is not set
CONFIG_DRM_FBDEV_OVERALLOC=100

#
# QEMU standard VGA / Bochs DRM driver
# This is the important one for QEMU default/std VGA.
#
# CONFIG_DRM_BOCHS is not set

#
# SimpleDRM fallback
#
# CONFIG_DRM_SIMPLEDRM is not set

#
# Console support
#
# CONFIG_VT is not set
# CONFIG_VT_CONSOLE is not set
CONFIG_HW_CONSOLE=y
CONFIG_DUMMY_CONSOLE=y
# CONFIG_FRAMEBUFFER_CONSOLE is not set

#
# Existing reductions
#
# CONFIG_FW_LOADER is not set
# CONFIG_NVMEM is not set
# CONFIG_CONNECTOR is not set
# CONFIG_PROC_EVENTS is not set
